<!-- ===== Mobile Shell (injected into www/index.html for Android only) ===== -->
<header class="m-top">
  <div class="m-top-title">TODO Assistant <small>留档助手</small></div>
  <div class="m-top-actions">
    <button type="button" class="m-icon" id="mThemeBtn" aria-label="切换主题">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
    </button>
    <button type="button" class="m-icon" id="mSettingsBtn" aria-label="设置">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 008 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H2a2 2 0 010-4h.09A1.65 1.65 0 004.6 8a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V2a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H22a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    </button>
  </div>
</header>

<nav class="m-tabbar">
  <button type="button" class="m-tab active" data-mtab="list">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    <span>列表</span>
  </button>
  <button type="button" class="m-tab" data-mtab="kanban">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="6" height="18" rx="1"/><rect x="9" y="3" width="6" height="11" rx="1" transform="translate(6 0)"/><rect x="3" y="3" width="6" height="18" rx="1"/><rect x="10" y="3" width="5" height="13" rx="1"/><rect x="17" y="3" width="4" height="8" rx="1"/></svg>
    <span>看板</span>
  </button>
  <button type="button" class="m-tab" data-mtab="stats">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    <span>统计</span>
  </button>
  <button type="button" class="m-tab" data-mtab="calendar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    <span>日历</span>
  </button>
</nav>

<section class="m-calendar" id="mCalendar" aria-hidden="true">
  <div class="cal-card">
    <div class="cal-head">
      <button type="button" class="cal-nav" id="calPrev" aria-label="上个月">‹</button>
      <div class="cal-title" id="calTitle"></div>
      <button type="button" class="cal-nav" id="calNext" aria-label="下个月">›</button>
    </div>
    <div class="cal-weekdays">
      <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>
  <div class="cal-day-panel">
    <div class="cal-day-head">
      <span class="cal-day-title" id="calDayTitle">今天</span>
      <button type="button" class="cal-add" id="calAddBtn">+ 新建计划</button>
    </div>
    <div class="cal-day-list" id="calDayList"></div>
  </div>
</section>

<button type="button" class="m-fab" id="mFab" aria-label="新建留档">+</button>

<div class="m-sheet-backdrop" id="mSheetBackdrop"></div>
<div class="m-sheet" id="mSheet" aria-hidden="true">
  <div class="m-sheet-head">
    <button type="button" class="m-sheet-btn" id="mSheetCancel">取消</button>
    <span class="m-sheet-title" id="mSheetTitle">新建留档</span>
    <button type="button" class="m-sheet-btn primary" id="mSheetSave">保存</button>
  </div>
  <div class="m-sheet-body" id="mComposerHost"></div>
</div>
